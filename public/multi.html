<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111317">
<title>작심삼일 - 멀티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-auth="pending" data-tab="multi" data-title="멀티">
<div class="shell shell--app shell--multi">
  <!-- 배경 빛과 점 패턴 (장식) -->
  <div class="multi-bg" aria-hidden="true">
    <div class="multi-bg__center"></div>
    <div class="multi-bg__corner"></div>
    <div class="multi-bg__bottom"></div>
    <div class="multi-bg__dots"></div>
  </div>
  <!-- 멀티는 이번 버전에서 구현하지 않는다 (API·DB 없음) -->
  <main class="page page--multi" id="page">
    <div class="multi-emblem" aria-hidden="true">
      <div class="multi-emblem__ring"></div>
      <div class="multi-emblem__core">
        <span class="icon multi-emblem__side multi-emblem__side--left">person</span>
        <span class="icon is-filled multi-emblem__main">groups</span>
        <span class="icon multi-emblem__side multi-emblem__side--right">person</span>
      </div>
      <span class="multi-emblem__node multi-emblem__node--a"></span>
      <span class="multi-emblem__node multi-emblem__node--b"></span>
    </div>
    <div class="multi-copy">
      <h1 class="multi-copy__title">COMING SOON</h1>
      <p class="multi-copy__sub">같이 작심할 친구들, 곧 만나요</p>
    </div>
    <div class="multi-mark" aria-hidden="true"><span class="multi-mark__dot"></span><span class="multi-mark__line"></span></div>
  </main>
</div>
<script src="/js/ui.js"></script>
<script src="/js/shell.js"></script>
</body>
</html>
